[project]
name = "bos-downloader"
version = "0.1.0"
description = "递归下载百度 BOS 指定文件夹,带进度与断点续传"
requires-python = ">=3.9"
dependencies = [
    "bce-python-sdk>=0.9.71",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "paramiko>=3.4",
]

[project.scripts]
bos-download = "bos_downloader.cli:main"
bos-upload = "bos_downloader.upload_cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bos_downloader"]
